[package]
name = "primer-app"
version = "0.1.0"
edition = "2024"
description = "primer GitHub App webhook server"
publish = false

[[bin]]
name = "primer-app"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.13", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
flate2 = "1"
tempfile = "3"
jsonwebtoken = "10"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6.11", features = ["fs"] }

[package.metadata.dist]
dist = false

[package.metadata.release]
release = false
