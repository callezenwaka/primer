name: Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "cli/**"
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"

# One set of permissions needed for Workload Identity Federation.
permissions:
  contents: read
  id-token: write  # OIDC token for keyless GCP auth

env:
  REGION: us-central1
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/primer/primer-app

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # ---------------------------------------------------------------------------
      # Build and push — tag with commit SHA for immutable builds, plus `latest`.
      # ---------------------------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy primer-app \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --service-account primer-app-sa@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com \
            --set-secrets APP_ID=primer-app-id:latest \
            --set-secrets APP_PRIVATE_KEY=primer-app-key:latest \
            --set-secrets WEBHOOK_SECRET=primer-webhook-secret:latest \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --quiet

      - name: Print service URL
        run: |
          gcloud run services describe primer-app \
            --region ${{ vars.GCP_REGION }} \
            --format "value(status.url)"
